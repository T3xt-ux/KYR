name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    name: ${{ github.ref == 'refs/heads/main' && 'Build & Deploy → Production' || 'Build & Preview' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Build & Deploy
        run: netlify deploy ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} --build
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 3333c58b-4545-4ef8-979c-0e35f0da9fb1
